<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Banco de pruebas de estilos con datos inventados: sirve para mirar las
     pantallas sin loguearse. Los íconos viven en el sprite de index.html, así
     que acá salen vacíos a propósito. -->

<header class="cabecera"><p class="marca">Cuentix</p></header>
<main id="contenido" class="contenido"></main>
<nav class="tabs">
  <button class="tab es-activo" data-tab="inicio"><span>Inicio</span></button>
  <button class="tab" data-tab="gastos"><span>Gastos</span></button>
  <button class="tab" data-tab="ahorros"><span>Ahorros</span></button>
  <button class="tab" data-tab="inversiones"><span>Inversiones</span></button>
  <button class="tab" data-tab="usuario"><span>Usuario</span></button>
</nav>
<script type="module">
import { renderInicio } from "./js/screens/inicio.js";
import { renderUsuario } from "./js/screens/usuario.js";
import { renderGastos } from "./js/screens/gastos.js";
import { renderAhorros } from "./js/screens/ahorros.js";
import { renderInversiones } from "./js/screens/inversiones.js";
import { mes } from "./js/periodo.js";
const movimientos = [
  {id:9, fecha:"2026-08-04", tipo:"gasto",   monto:8500,   moneda:"ARS", categoria:"comida",        descripcion:"pancho y coca"},
  {id:8, fecha:"2026-08-04", tipo:"gasto",   monto:45000,  moneda:"ARS", categoria:"servicios",     descripcion:"luz"},
  {id:7, fecha:"2026-08-03", tipo:"gasto",   monto:32000,  moneda:"ARS", categoria:"supermercado",  descripcion:"compra semanal"},
  {id:6, fecha:"2026-08-03", tipo:"ingreso", monto:300000, moneda:"ARS", categoria:"sueldo",        descripcion:"sueldo agosto"},
  {id:5, fecha:"2026-08-02", tipo:"gasto",   monto:12000,  moneda:"ARS", categoria:"transporte",    descripcion:"nafta"},
  {id:4, fecha:"2026-08-02", tipo:"ahorro",  monto:50000,  moneda:"ARS", categoria:"plazo fijo",    descripcion:"plazo fijo"},
  {id:3, fecha:"2026-08-01", tipo:"gasto",   monto:18000,  moneda:"ARS", categoria:"ocio",          descripcion:"cine y cena"},
  {id:2, fecha:"2026-08-01", tipo:"gasto",   monto:9000,   moneda:"ARS", categoria:"salud",         descripcion:"farmacia"},
  {id:1, fecha:"2026-08-01", tipo:"gasto",   monto:4000,   moneda:"ARS", categoria:"ropa",          descripcion:"medias"},
];

// Julio, para que Gastos tenga contra qué comparar.
const previos = [
  {id:19, fecha:"2026-07-05", tipo:"gasto", monto:38000, moneda:"ARS", categoria:"servicios",    descripcion:"luz y gas"},
  {id:18, fecha:"2026-07-09", tipo:"gasto", monto:31000, moneda:"ARS", categoria:"supermercado", descripcion:"compra"},
  {id:17, fecha:"2026-07-14", tipo:"gasto", monto:6000,  moneda:"ARS", categoria:"ocio",         descripcion:"cine"},
  {id:16, fecha:"2026-07-20", tipo:"gasto", monto:9500,  moneda:"ARS", categoria:"comida",       descripcion:"delivery"},
];

// Ahorros mira toda la historia, no solo el período.
const historialDeAhorros = [
  {id:29, fecha:"2026-08-02", tipo:"ahorro", monto:50000, moneda:"ARS", categoria:"plazo fijo", descripcion:"pf", cuenta:"banco"},
  {id:28, fecha:"2026-06-05", tipo:"ahorro", monto:40000, moneda:"ARS", categoria:"plazo fijo", descripcion:"pf", cuenta:"banco"},
  {id:27, fecha:"2026-04-11", tipo:"ahorro", monto:25000, moneda:"ARS", categoria:"para el viaje", descripcion:"viaje", cuenta:"efectivo"},
  {id:26, fecha:"2026-02-20", tipo:"ahorro", monto:18000, moneda:"ARS", categoria:"para el viaje", descripcion:"viaje", cuenta:null},
];

const contenido = document.querySelector("#contenido");
const pantallas = {
  inicio: renderInicio,
  gastos: renderGastos,
  ahorros: renderAhorros,
  inversiones: renderInversiones,
  usuario: renderUsuario,
};

let tab = "inicio";
let categoriaAbierta = null;

// El mismo contexto que arma el router en la app de verdad.
function pintar() {
  pantallas[tab](contenido, {
    movimientos,
    movimientosPrevios: previos,
    historialAhorros: historialDeAhorros,
    cotizacion: { compra: 1470, venta: 1520, fecha: "2026-08-05T15:00:00.000Z", vencida: false },
    falloCotizacion: false,
    periodo: mes(2026, 7),
    moneda: "ARS",
    monedas: ["ARS", "USD"],
    categoriaAbierta,
    email: "vos@ejemplo.com",
    setMoneda: () => {},
    setCategoria: (c) => { categoriaAbierta = c; pintar(); },
    onSalir: () => {},
  });
}

for (const boton of document.querySelectorAll(".tab")) {
  boton.addEventListener("click", () => {
    for (const otro of document.querySelectorAll(".tab")) {
      otro.classList.toggle("es-activo", otro === boton);
    }
    tab = boton.dataset.tab;
    categoriaAbierta = null;
    pintar();
  });
}

pintar();
</script>
</body>
</html>
