<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Banco de pruebas de estilos con datos inventados: sirve para mirar las
     pantallas sin loguearse.

     Los íconos de las tabs se repiten acá abajo en chiquito. Es duplicación a
     propósito: en pantalla grande la barra se va al costado y se queda solo
     con los íconos, así que un banco sin ellos mostraría una franja vacía y no
     serviría para revisar justo el layout que hay que revisar.

     Los otros cuatro son los que usan las pantallas por dentro: el "+" de
     objetivo nuevo, el "volver" de las vistas de detalle, la basura del
     formulario y la salida de Usuario. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-casa"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></g>
    <g id="i-gastos"><path d="M3 12h18M3 12l4-4M3 12l4 4"/><circle cx="17" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></g>
    <g id="i-ahorro"><path d="M4 9h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/><circle cx="12" cy="14" r="1.6"/></g>
    <g id="i-inversion"><path d="M4 18l5-5 3 3 7-8"/><path d="M15 8h4v4"/></g>
    <g id="i-usuario"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></g>
    <g id="i-izquierda"><path d="M14.5 6.5 9 12l5.5 5.5"/></g>
    <g id="i-mas"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-basura"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/><path d="M10 11v6M14 11v6"/></g>
    <g id="i-salir"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></g>
    <g id="i-calendario"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></g>
    <g id="i-ojo"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
  </defs>
</svg>

<!-- El mismo envoltorio que index.html. No es decorativo: en pantalla grande es
     el que se corre para dejarle lugar a la barra lateral, así que sin él el
     banco mostraría el contenido por debajo de la barra. -->
<!-- El encabezado con sus controles, igual que en index.html. No es decoración:
     en pantalla grande el grupo entero se muda al pie de la barra lateral, así
     que sin él acá el banco no serviría para revisar el menú, que es la mitad
     de lo que hay que revisar. Los botones no hacen nada; están por la forma. -->
<div id="vista-app">
<header class="cabecera">
  <p class="marca">Cuentix</p>
  <div class="cabecera-acciones">
    <button id="btn-periodo" class="boton-periodo" aria-expanded="false">
      <svg viewBox="0 0 24 24" class="icono"><use href="#i-calendario"></use></svg>
      <span>agosto</span>
    </button>
    <button class="boton-icono es-texto" aria-pressed="false">US$</button>
    <button class="boton-icono" aria-label="Ocultar montos">
      <svg viewBox="0 0 24 24" class="icono"><use href="#i-ojo"></use></svg>
    </button>
    <div id="panel-periodo" class="panel" hidden></div>
  </div>
</header>
<main id="contenido" class="contenido"></main>
<nav class="tabs" aria-label="Secciones"></nav>
</div>
<script type="module">
import { renderInicio } from "./js/screens/inicio.js";
import { renderUsuario } from "./js/screens/usuario.js";
import { renderGastos } from "./js/screens/gastos.js";
import { renderAhorros } from "./js/screens/ahorros.js";
import { renderInversiones } from "./js/screens/inversiones.js";
import { animarCifras, empezarPintado, terminarPintado } from "./js/animar.js";
import { marcarActiva, montarBarra } from "./js/barraSecciones.js";
import { mes } from "./js/periodo.js";
import { fijarCotizacion } from "./js/format.js";

// Las mismas cinco secciones que TABS en router.js, sin las funciones de pintado
// ni las banderas de datos: acá solo se necesita el nombre y el ícono. Importar
// TABS arrastraría el router entero y con él el estado de la app de verdad.
const TABS_PREVIEW = [
  { id: "inicio", nombre: "Inicio", icono: "i-casa" },
  { id: "gastos", nombre: "Gastos", icono: "i-gastos" },
  { id: "ahorros", nombre: "Ahorros", icono: "i-ahorro" },
  { id: "inversiones", nombre: "Inversiones", icono: "i-inversion" },
  { id: "usuario", nombre: "Usuario", icono: "i-usuario", aparte: true },
];

// En la app las fija app.js con lo que devuelve cotizaciones.js. Sin esto, la
// distribución no se dibuja: sin una moneda común, un reparto porcentual entre
// pesos y dólares no significaría nada.
fijarCotizacion({
  venta: 1520,
  fecha: "2026-08-05T15:00:00.000Z",
  vencida: false,
  tasas: { USD: 1, ARS: 1 / 1520, EUR: 1.1554 },
  eurAproximado: false,
});

// Tenencias de ejemplo. Cubren los tres casos que la pantalla distingue:
// cripto con precio de mercado (una en ganancia y otra en pérdida), activos sin
// precio todavía, y dos monedas para que haya distribución por moneda.
const inversiones = [
  {id:"a", tipo:"cripto", ticker:"BTC",  nombre:"Bitcoin",       cantidad:0.5,  precio_compra:60000, moneda:"USD", fecha_compra:"2026-03-12", sector:null},
  {id:"b", tipo:"cripto", ticker:"ETH",  nombre:"Ethereum",      cantidad:4,    precio_compra:3200,  moneda:"USD", fecha_compra:"2026-05-02", sector:null},
  {id:"c", tipo:"cedear", ticker:"AAPL", nombre:"Apple",         cantidad:10,   precio_compra:25,    moneda:"USD", fecha_compra:"2026-08-06", sector:"tecnología"},
  {id:"d", tipo:"accion", ticker:"TSLA", nombre:"Tesla",         cantidad:3,    precio_compra:250,   moneda:"USD", fecha_compra:"2026-03-12", sector:null},
  {id:"e", tipo:"bono",   ticker:"AL30", nombre:"AL30",          cantidad:100,  precio_compra:1200,  moneda:"ARS", fecha_compra:"2026-07-01", sector:null},
  {id:"f", tipo:"fci",    ticker:null,   nombre:"FCI Pellegrini", cantidad:1,   precio_compra:80000, moneda:"ARS", fecha_compra:"2026-06-15", sector:null},
];

// Lo que devolvería CoinGecko. Fijos y no en vivo para que el preview se vea
// igual siempre: BTC arriba de la compra, ETH abajo, para ver los dos colores.
const precios = { BTC: 71500, ETH: 2740 };
const movimientos = [
  {id:9, fecha:"2026-08-04", tipo:"gasto",   monto:8500,   moneda:"ARS", categoria:"comida",        descripcion:"pancho y coca"},
  {id:8, fecha:"2026-08-04", tipo:"gasto",   monto:45000,  moneda:"ARS", categoria:"servicios",     descripcion:"luz"},
  {id:7, fecha:"2026-08-03", tipo:"gasto",   monto:32000,  moneda:"ARS", categoria:"supermercado",  descripcion:"compra semanal"},
  {id:6, fecha:"2026-08-03", tipo:"ingreso", monto:300000, moneda:"ARS", categoria:"sueldo",        descripcion:"sueldo agosto"},
  {id:5, fecha:"2026-08-02", tipo:"gasto",   monto:12000,  moneda:"ARS", categoria:"transporte",    descripcion:"nafta"},
  {id:4, fecha:"2026-08-02", tipo:"ahorro",  monto:50000,  moneda:"ARS", categoria:"plazo fijo",    descripcion:"plazo fijo"},
  {id:3, fecha:"2026-08-01", tipo:"gasto",   monto:18000,  moneda:"ARS", categoria:"ocio",          descripcion:"cine y cena"},
  {id:2, fecha:"2026-08-01", tipo:"gasto",   monto:9000,   moneda:"ARS", categoria:"salud",         descripcion:"farmacia"},
  {id:1, fecha:"2026-08-01", tipo:"gasto",   monto:4000,   moneda:"ARS", categoria:"ropa",          descripcion:"medias"},
];

// Julio, para que Gastos tenga contra qué comparar.
const previos = [
  {id:19, fecha:"2026-07-05", tipo:"gasto", monto:38000, moneda:"ARS", categoria:"servicios",    descripcion:"luz y gas"},
  {id:18, fecha:"2026-07-09", tipo:"gasto", monto:31000, moneda:"ARS", categoria:"supermercado", descripcion:"compra"},
  {id:17, fecha:"2026-07-14", tipo:"gasto", monto:6000,  moneda:"ARS", categoria:"ocio",         descripcion:"cine"},
  {id:16, fecha:"2026-07-20", tipo:"gasto", monto:9500,  moneda:"ARS", categoria:"comida",       descripcion:"delivery"},
];

// Ahorros mira toda la historia, no solo el período. Dos de estos van imputados
// a un objetivo: sin `objetivo_id` las barras de progreso quedarían todas en
// cero y no se vería el formato real de la tarjeta.
const historialDeAhorros = [
  {id:29, fecha:"2026-08-02", tipo:"ahorro", monto:50000, moneda:"ARS", categoria:"plazo fijo", descripcion:"pf", cuenta:"banco"},
  {id:28, fecha:"2026-06-05", tipo:"ahorro", monto:40000, moneda:"ARS", categoria:"plazo fijo", descripcion:"pf", cuenta:"banco"},
  {id:27, fecha:"2026-04-11", tipo:"ahorro", monto:25000, moneda:"ARS", categoria:"para el viaje", descripcion:"viaje", cuenta:"efectivo", objetivo_id:"o1"},
  {id:26, fecha:"2026-02-20", tipo:"ahorro", monto:18000, moneda:"ARS", categoria:"colchón", descripcion:"colchón", cuenta:null, objetivo_id:"o2"},
];

// Los tres estados que la lista distingue: uno en curso, uno pasado de meta —que
// se dibuja como completado— y uno en pausa.
const objetivos = [
  {id:"o1", nombre:"Viaje a Japón", descripcion:"Dos semanas, en primavera", monto_objetivo:500000,
   moneda:"ARS", fecha_estimada:"2027-03-15", prioridad:"alta", icono:"✈️", color:"cat-1", estado:"activo"},
  {id:"o2", nombre:"Fondo de emergencia", descripcion:null, monto_objetivo:15000,
   moneda:"ARS", fecha_estimada:null, prioridad:"media", icono:"🎯", color:"cat-4", estado:"activo"},
  {id:"o3", nombre:"Notebook nueva", descripcion:null, monto_objetivo:1200000,
   moneda:"ARS", fecha_estimada:"2026-12-01", prioridad:"baja", icono:"💻", color:"cat-6", estado:"pausado"},
];

const contenido = document.querySelector("#contenido");
const pantallas = {
  inicio: renderInicio,
  gastos: renderGastos,
  ahorros: renderAhorros,
  inversiones: renderInversiones,
  usuario: renderUsuario,
};

// La pantalla se puede fijar por URL (?tab=gastos): así se pueden comparar
// anchos sin tener que ir clickeando la barra en cada captura.
let tab = new URLSearchParams(location.search).get("tab") ?? "inicio";
if (!pantallas[tab]) tab = "inicio";
let categoriaAbierta = null;
// Las dos vistas de detalle del banco: el desglose de una categoría en Gastos y
// el formulario de objetivo en Ahorros. Van acá y no adentro de pintar() por lo
// mismo que en la app: redibujar la pantalla no puede perder dónde estabas.
let vistaObjetivo = null;
let confirmandoBorrado = false;

// El mismo contexto que arma el router en la app de verdad.
function pintar() {
  // Lo mismo que hace router.js: es lo que el CSS usa para saber qué layout
  // corresponde en pantalla grande.
  contenido.dataset.pantalla = tab;

  // En el banco TODO pintado se anima, al revés que en la app: acá se viene
  // justamente a mirar cómo entran las cosas, así que conviene que se repita en
  // cada toque en vez de solo al cambiar de sección.
  contenido.classList.remove("es-nueva");
  void contenido.offsetWidth; // fuerza el reflujo, si no la clase no se reinicia
  contenido.classList.add("es-nueva");
  empezarPintado(true);

  pantallas[tab](contenido, {
    movimientos,
    movimientosPrevios: previos,
    historialAhorros: historialDeAhorros,
    cotizacion: { compra: 1470, venta: 1520, fecha: "2026-08-05T15:00:00.000Z", vencida: false },
    falloCotizacion: false,
    periodo: mes(2026, 7),
    moneda: "ARS",
    monedas: ["ARS", "USD"],
    inversiones,
    errorInversiones: null,
    precios,
    errorPrecios: null,
    sinCotizar: [],
    // El proxy del bot: le pone precio a lo que no es cripto. AL30 arriba de la
    // compra y TSLA abajo, para que la lista muestre los dos colores. AAPL y el
    // FCI quedan afuera a propósito: son el caso "sin cotización".
    preciosMercado: { "ar:AL30": { precio: 1310 }, "us:TSLA": { precio: 214 } },
    errorMercado: null,
    sinCoberturaMercado: ["AAPL"],
    historico: null,
    verHistorico: () => {},
    objetivos,
    vistaObjetivo,
    guardando: false,
    errorObjetivo: null,
    confirmandoBorrado,
    categoriaAbierta,
    email: "vos@ejemplo.com",
    setMoneda: () => {},
    setCategoria: (c) => { categoriaAbierta = c; pintar(); },
    abrirObjetivo: (cual) => { vistaObjetivo = cual; confirmandoBorrado = false; pintar(); },
    pedirBorrado: (si) => { confirmandoBorrado = si; pintar(); },
    // El banco no guarda ni borra nada: solo sirve para mirar cómo se ve.
    guardarObjetivo: () => {},
    borrarObjetivo: () => {},
    onSalir: () => {},
  });

  animarCifras(contenido);
  terminarPintado();
}

// La barra la monta el módulo de verdad, no una copia hecha a mano acá. Es la
// pieza que más cambia entre tamaños —franja abajo, columna al costado, columna
// que se abre— y una copia quedaría desincronizada al primer retoque, que es
// justo cuando el banco tendría que servir para algo.
const nav = document.querySelector(".tabs");
montarBarra(nav, TABS_PREVIEW, (id) => {
  tab = id;
  categoriaAbierta = null;
  vistaObjetivo = null;
  confirmandoBorrado = false;
  marcarActiva(nav, tab);
  pintar();
});

marcarActiva(nav, tab);
pintar();
</script>
</body>
</html>
