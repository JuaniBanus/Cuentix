<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<title>Cuentix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Íconos: sprite propio en vez de traer Phosphor por CDN. Mismo trazo de 1.5,
     una petición menos y funciona aunque el CDN esté caído. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-casa"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></g>
    <g id="i-gastos"><path d="M3 12h18M3 12l4-4M3 12l4 4"/><circle cx="17" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></g>
    <g id="i-ahorro"><path d="M4 9h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/><circle cx="12" cy="14" r="1.6"/></g>
    <g id="i-inversion"><path d="M4 18l5-5 3 3 7-8"/><path d="M15 8h4v4"/></g>
    <g id="i-ojo"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="i-ojo-tachado"><path d="M2 12s3.6-6.5 10-6.5c2 0 3.7.6 5.2 1.5M22 12s-3.6 6.5-10 6.5c-2 0-3.8-.6-5.2-1.5"/><path d="M4 4l16 16"/></g>
    <g id="i-salir"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></g>
  </defs>
</svg>

<!-- Se muestra mientras se resuelve si hay sesión. Sin esto, quien ya entró ve
     un parpadeo del login antes de que la app aparezca. -->
<div id="vista-carga" class="carga-inicial">
  <p class="login-marca">Cuentix</p>
</div>

<!-- ------------------------------------------------------------------ Login -->
<main id="vista-login" class="login" hidden>
  <div class="login-caja">
    <p class="login-marca">Cuentix</p>
    <h1 class="login-titulo">Tus cuentas, en orden</h1>
    <p class="apunte login-apunte">Entrá para ver tus movimientos.</p>

    <form id="form-login" autocomplete="on">
      <label class="campo">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="username" inputmode="email">
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="boton boton-acento">Entrar</button>
    </form>
  </div>
</main>

<!-- -------------------------------------------------------------------- App -->
<div id="vista-app" hidden>
  <header class="cabecera">
    <p class="marca">Cuentix</p>
    <div class="cabecera-acciones">
      <!-- El title es el tooltip que pide aclarar cómo se valúa. Se repite en
           aria-label porque los lectores de pantalla no anuncian title en un
           botón que ya tiene nombre accesible. -->
      <button id="btn-usd" class="boton-icono boton-texto" aria-pressed="false"
              aria-label="Ver todo en dólares. Los movimientos en otras monedas se valúan al tipo de cambio de hoy, no al del día en que ocurrieron."
              title="Ver todo en USD&#10;&#10;Convierte ARS y EUR al tipo de cambio de HOY.&#10;Los movimientos históricos se valúan a hoy, no al&#10;cambio del día en que ocurrieron.">US$</button>
      <button id="btn-ojo" class="boton-icono" aria-pressed="false" aria-label="Ocultar montos">
        <svg viewBox="0 0 24 24" class="icono"><use href="#i-ojo"></use></svg>
      </button>
      <button id="btn-salir" class="boton-icono" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" class="icono"><use href="#i-salir"></use></svg>
      </button>
    </div>
  </header>

  <!-- Vive fuera de #contenido, que cada pantalla reescribe entero: así el
       aviso de conversión aparece en todas sin que ninguna tenga que saber
       que existe. -->
  <p id="aviso-usd" class="aviso-usd" role="status" hidden></p>

  <main id="contenido" class="contenido"></main>

  <nav class="tabs" aria-label="Secciones">
    <button class="tab es-activo" data-tab="inicio" aria-current="page">
      <svg viewBox="0 0 24 24" class="icono"><use href="#i-casa"></use></svg><span>Inicio</span>
    </button>
    <button class="tab" data-tab="gastos" aria-current="false">
      <svg viewBox="0 0 24 24" class="icono"><use href="#i-gastos"></use></svg><span>Gastos</span>
    </button>
    <button class="tab" data-tab="ahorros" aria-current="false">
      <svg viewBox="0 0 24 24" class="icono"><use href="#i-ahorro"></use></svg><span>Ahorros</span>
    </button>
    <button class="tab" data-tab="inversiones" aria-current="false">
      <svg viewBox="0 0 24 24" class="icono"><use href="#i-inversion"></use></svg><span>Inversiones</span>
    </button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
